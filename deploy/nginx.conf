limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=12r/s;

map $uri $edge_cache_policy {
    ~^/api/                     "";
    ~^/assets/                  "public, max-age=31536000, immutable";
    =/service-worker.js         "no-cache, max-age=0, must-revalidate";
    =/asset-manifest.json       "no-cache, max-age=0, must-revalidate";
    default                     "no-cache, max-age=0, must-revalidate";
}

map $uri $edge_cache_status {
    ~^/api/                     "BYPASS";
    ~^/assets/                  "IMMUTABLE";
    default                     "REVALIDATE";
}

server {
    listen 8080 default_server;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;

    sendfile on;
    tcp_nopush on;
    etag on;
    open_file_cache max=1000 inactive=60s;
    open_file_cache_valid 60s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript application/json image/svg+xml text/css text/plain;

    add_header Cache-Control $edge_cache_policy always;
    add_header X-Edge-Cache $edge_cache_status always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'self'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Request-ID $request_id always;

    location = /api/health/live {
        proxy_pass http://origin:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Request-ID;
    }

    location /api/ {
        limit_req zone=api_per_ip burst=30 nodelay;
        limit_req_status 429;

        proxy_pass http://origin:8766;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 2s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_no_cache 1;
        proxy_cache_bypass 1;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Request-ID;
    }

    location /assets/ {
        try_files $uri =404;
        access_log off;
        limit_except GET HEAD { deny all; }
    }

    location = /service-worker.js {
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location = /asset-manifest.json {
        try_files $uri =404;
        limit_except GET HEAD { deny all; }
    }

    location / {
        try_files $uri $uri/ /index.html;
        limit_except GET HEAD { deny all; }
    }
}
