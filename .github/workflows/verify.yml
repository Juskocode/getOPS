name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-doctor:
    name: Repository doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libpq-dev

      - name: Install workspace dependencies
        run: npm ci

      - name: Run repository contracts
        run: npm run doctor

      - name: Build React release
        run: npm run web:build

      - name: Run PostgreSQL repository integration
        run: npm run api:test:postgres

      - name: Run socket-level API integration
        run: npm run api:test:http
