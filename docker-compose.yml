name: trading-ops-ascent

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: getops
      POSTGRES_PASSWORD: ${GETOPS_DB_PASSWORD:-getops-local-only}
      POSTGRES_DB: getops
    volumes:
      - getops-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${GETOPS_DB_PORT:-55432}:5432"
    shm_size: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U getops -d getops"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  migrate:
    image: postgres:17-alpine
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${GETOPS_DB_PASSWORD:-getops-local-only}
    volumes:
      - ./db/migrations:/migrations:ro
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        for file in /migrations/*.sql; do
          echo "Applying $${file}"
          psql --set ON_ERROR_STOP=1 \
            --host db --username getops --dbname getops \
            --file "$${file}"
        done

  api:
    build:
      context: .
      dockerfile: deploy/api.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      GETOPS_BIND: 0.0.0.0
      GETOPS_PORT: 8780
      GETOPS_WORKERS: ${GETOPS_WORKERS:-8}
      GETOPS_DATABASE_URL: "host=db port=5432 dbname=getops user=getops password=${GETOPS_DB_PASSWORD:-getops-local-only}"
      GETOPS_CATALOG_PATH: /app/content/flashcards.json
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8780/api/v1/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  edge:
    build:
      context: .
      dockerfile: deploy/edge.Dockerfile
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OPS_BIND:-127.0.0.1}:${OPS_PORT:-8766}:8080"
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=0700,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/api/v1/health/live"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  getops-postgres:
